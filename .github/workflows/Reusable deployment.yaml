name: Deployment- Reusable
on: 
    workflow_call:
     inputs:
        mongodb-uri:
            required: true
            type: string
        kubectl-version:
            required: false
            default: v1.26.0
            required: false
            type: string
        k8s-manifest-dir:
            required: true
            default: Kubernetes/
            type: string
        environment:
            type: string
            required: true
            default: dev
     outputs:
        application-uri:
            value: ${{ jobs.reusable-workflow.outputs.APP_INGRESS_URL }}

     secrets:
        k8s-kubeconfig: 
            required: true
        mongodb-password:
            required: true

jobs:
    reusable-workflow:

        needs: docker
        runs-on: ubuntu-latest
        outputs: 
            APP_INGRESS_URL: ${{ steps.set-ingress-host-address.output.APP_INGRESS_HOST }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Install Kubectl
              uses: azure/setup-kubectl@v3
              with:
                 version: ${{ inputs.kubectl-version }}

            - name: Setup Kubeconfig
              uses: azure/k8s-setup-context@v3
              with: 
                 method: kubeconfig
                 kubeconfig: ${{ secrets.k8s-kubeconfig }}


            - name: Fetech Kubernetes details
              run: | 
                kubectl version --short
                kubectl get nodes

            - name: Save INGRESS IP address
              run: |
                 echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadbalancer.ingress[0].ip}")" >>$GITHUB_ENV

 
           
            - name: Replace token in manifest files
              uses: cschleiden/replace-token@v1
              with: 
                tokenPrefix: '_{_'
                tokenSuffix: '_}_'
                files: '[${{ inputs.k8s-manifest-dir }}*.yaml"]' 
             env:
                 NAMESPACE: ${{ vars.NAMESPACE }}
                 REPLICAS: ${{ vars.REPLICAS }}
                 IMAGE: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }} 
                 INGRESS_IP: ${{ env.INGRESS_IP }}
                 
            - name: Check files
              run: |
                   cat ${{ inputs.k8s-manifest-dir }}*.yaml 

            -  name: Create MongoDB secret
               run: |
                  kubectl -n ${{vars.NAMESPACE }} create secret generic mongo-db-creds \
                  --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
                  --from-literal=MONGO_USERNAME=${{ Vars.MONGO_USERNAME }} \
                  --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \ 
                  --save-config \
                  --dry-run-Client\
                  --o yaml | kubectl apply -f -     

            - name: Deploy to DEV env
              run: |
                 kubectl apply ${{ inputs.k8s-manifest-dir }} 
                 
            - name: Setup Ingress URL 
              id: set-ingress-host-address
              run: |
                echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get-ingress -o jsonpath="{.items[0].spec.tls[0].hosts[0]}")"    
               
